spring.application.name=movez

# Configuracao do Banco de Dados Oracle FIAP
# As variaveis de ambiente DB_URL, DB_USER e DB_PASSWORD podem ser configuradas no Render ou localmente
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:rmXXXXXX}
spring.datasource.password=${DB_PASSWORD:XXXXXX}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexoes HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Porta do servidor (Render injeta a porta na variavel PORT)
server.port=${PORT:8080}

# Desativar inicializacao automatica de scripts SQL pelo Spring (executado no banco Oracle da FIAP)
spring.sql.init.mode=never

# Tratamento de erro padrao
server.error.include-stacktrace=never
server.error.include-message=never
