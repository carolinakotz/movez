services:
  - type: web
    name: movez-api
    env: docker
    dockerfilePath: backend/movez/Dockerfile
    dockerContext: backend/movez
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
